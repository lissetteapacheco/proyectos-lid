<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proyectos LID</title>
<style>
  :root {
    --bg: #FDFDFC;
    --bg-alt: #F6F7F8;
    --ink: #1A1D21;
    --ink-soft: #5B6169;
    --line: #E4E6E9;
    --line-soft: #EEEFF1;
    --blue: #1D5FA8;
    --blue-soft: #EAF1FA;
    --blue-dark: #123E70;
    --tag-bg: #F1F2F4;
    --tag-ink: #4A5058;
    --accent-teal: #17A6A0;
    --accent-amber: #E0972B;
    --white: #FFFFFF;
    --radius: 10px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100%;
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 48px 28px 96px;
  }

  @media (max-width: 600px) {
    .wrap { padding: 32px 18px 72px; }
  }

  /* ---------- Header ---------- */

  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    margin-bottom: 56px;
  }

  .logo-mark {
    height: 40px;
    width: auto;
    opacity: 0.92;
    flex-shrink: 0;
  }

  .title-block h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
    color: var(--ink);
  }

  .title-block p {
    font-size: 15px;
    color: var(--ink-soft);
    margin: 0;
    line-height: 1.5;
    max-width: 480px;
  }

  @media (max-width: 640px) {
    header.top { flex-direction: column-reverse; align-items: flex-start; gap: 20px; }
  }

  /* ---------- Indicators ---------- */

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 40px;
    background: var(--white);
  }

  .stat {
    padding: 22px 20px;
    border-right: 1px solid var(--line);
  }

  .stat:last-child { border-right: none; }

  .stat .num {
    font-size: 28px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1;
    margin-bottom: 6px;
    font-variant-numeric: tabular-nums;
  }

  .stat .label {
    font-size: 13px;
    color: var(--ink-soft);
  }

  @media (max-width: 560px) {
    .stats { grid-template-columns: 1fr; }
    .stat { border-right: none; border-bottom: 1px solid var(--line); }
    .stat:last-child { border-bottom: none; }
  }

  /* ---------- Filters ---------- */

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 36px;
  }

  .filter-btn {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--white);
    color: var(--ink-soft);
    font-size: 13.5px;
    font-family: inherit;
    padding: 7px 14px;
    border-radius: 100px;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }

  .filter-btn:hover {
    border-color: var(--blue);
    color: var(--blue-dark);
  }

  .filter-btn.active {
    background: var(--blue);
    border-color: var(--blue);
    color: var(--white);
  }

  /* ---------- Cards ---------- */

  .card-grid {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 26px 26px;
    cursor: pointer;
    transition: border-color .15s ease;
  }

  .card:hover {
    border-color: var(--blue);
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 10px;
  }

  .card-name {
    font-size: 19px;
    font-weight: 700;
    color: var(--ink);
    margin: 0;
  }

  .status-pill {
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 11px;
    border-radius: 100px;
    white-space: nowrap;
    border: 1px solid transparent;
  }

  .card-desc {
    font-size: 14.5px;
    color: var(--ink-soft);
    line-height: 1.6;
    margin: 0 0 18px;
    max-width: 640px;
  }

  .tag-row {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 18px;
  }

  .tag {
    font-size: 12.5px;
    color: var(--tag-ink);
    background: var(--tag-bg);
    padding: 5px 11px;
    border-radius: 6px;
  }

  .card-action {
    font-size: 14px;
    font-weight: 600;
    color: var(--blue);
  }

  /* Status pill color variants — subtle, text-led */
  .st-Planificacion { background: var(--tag-bg); color: var(--tag-ink); }
  .st-Diseno        { background: var(--tag-bg); color: var(--tag-ink); }
  .st-Desarrollo    { background: var(--blue-soft); color: var(--blue-dark); }
  .st-Implementacion{ background: var(--blue-soft); color: var(--blue-dark); }
  .st-Operacion     { background: #EAF7F0; color: #157A5A; }
  .st-Finalizado    { background: #F1F2F4; color: #3A3F45; }

  /* ---------- Detail view ---------- */

  .detail {
    display: none;
  }

  .detail.visible {
    display: block;
  }

  .main-view.hidden {
    display: none;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 600;
    color: var(--blue);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    margin-bottom: 36px;
    font-family: inherit;
  }

  .back-link:hover { color: var(--blue-dark); }

  .detail-header {
    margin-bottom: 28px;
  }

  .detail-header .status-pill {
    margin-bottom: 14px;
    display: inline-block;
  }

  .detail-header h2 {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 16px;
    letter-spacing: -0.01em;
  }

  .detail-desc {
    font-size: 16px;
    line-height: 1.65;
    color: var(--ink);
    max-width: 640px;
    margin: 0 0 0;
  }

  .detail-context {
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--ink-soft);
    max-width: 640px;
    margin: 14px 0 0;
    padding-top: 14px;
    border-top: 1px solid var(--line-soft);
  }

  .detail .tag-row { margin: 24px 0 0; }

  .section {
    margin-top: 40px;
    padding-top: 32px;
    border-top: 1px solid var(--line);
  }

  .section h3 {
    font-size: 13px;
    font-weight: 700;
    text-transform: none;
    color: var(--ink-soft);
    margin: 0 0 12px;
    letter-spacing: 0.01em;
  }

  .section p {
    font-size: 15.5px;
    line-height: 1.65;
    color: var(--ink);
    margin: 0;
    max-width: 640px;
  }

  .avance-groups {
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .avance-group h4 {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    margin: 0 0 4px;
  }

  .avance-group p {
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink-soft);
    margin: 0;
  }

  .next-step-box {
    background: var(--blue-soft);
    border-radius: var(--radius);
    padding: 18px 20px;
    max-width: 640px;
  }

  .next-step-box p {
    color: var(--blue-dark);
    font-weight: 500;
  }

  /* Atención */

  .attention-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 640px;
  }

  .attention-item {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 14px 16px;
    border-radius: 8px;
    border: 1px solid transparent;
  }

  .a-dot {
    flex-shrink: 0;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-top: 6px;
  }

  .attention-item .a-body {
    flex: 1;
  }

  .attention-item .a-level {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-bottom: 3px;
  }

  .attention-item .a-subject {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 3px;
  }

  .attention-item .a-desc {
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.55;
  }

  /* En curso — verde suave */
  .attn-curso {
    background: #F0F8F3;
    border-color: #DCEFE2;
  }
  .attn-curso .a-dot { background: #3C9A5F; }
  .attn-curso .a-level { color: #2E7A4B; }

  /* Atención — amarillo suave */
  .attn-atencion {
    background: #FDF7E8;
    border-color: #F5E9C4;
  }
  .attn-atencion .a-dot { background: #C99A2E; }
  .attn-atencion .a-level { color: #97731F; }

  /* Crítico — rojo suave */
  .attn-critico {
    background: #FCEEEE;
    border-color: #F3D4D4;
  }
  .attn-critico .a-dot { background: #C24444; }
  .attn-critico .a-level { color: #A23434; }

  /* Milestones */

  .milestones {
    max-width: 640px;
  }

  .milestone {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    position: relative;
    padding-bottom: 20px;
  }

  .milestone:last-child { padding-bottom: 0; }

  .milestone::before {
    content: '';
    position: absolute;
    left: 9px;
    top: 22px;
    bottom: -2px;
    width: 1px;
    background: var(--line);
  }

  .milestone:last-child::before { display: none; }

  .m-marker {
    flex-shrink: 0;
    width: 19px;
    height: 19px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    margin-top: 1px;
    z-index: 1;
    background: var(--bg);
  }

  .m-done .m-marker { background: var(--blue); color: var(--white); }
  .m-current .m-marker { background: var(--white); border: 2px solid var(--blue); }
  .m-current .m-marker::after {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--blue);
  }
  .m-pending .m-marker { border: 1.5px solid var(--line); }

  .m-label {
    font-size: 14.5px;
    line-height: 1.5;
    padding-top: 1px;
  }

  .m-done .m-label { color: var(--ink); }
  .m-current .m-label { color: var(--blue-dark); font-weight: 600; }
  .m-pending .m-label { color: var(--ink-soft); }

  /* Timeline */

  .timeline {
    max-width: 720px;
  }

  .timeline-track {
    position: relative;
    padding-left: 2px;
  }

  .t-item {
    display: flex;
    gap: 16px;
    position: relative;
    padding-bottom: 22px;
  }

  .t-item:last-child { padding-bottom: 0; }

  .t-rail {
    flex-shrink: 0;
    width: 11px;
    display: flex;
    justify-content: center;
    position: relative;
  }

  .t-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--line);
    margin-top: 4px;
    z-index: 1;
  }

  .t-item.t-now .t-dot {
    background: var(--blue);
    box-shadow: 0 0 0 4px var(--blue-soft);
  }

  .t-line {
    position: absolute;
    top: 13px;
    bottom: -22px;
    left: 50%;
    transform: translateX(-50%);
    width: 1px;
    background: var(--line);
  }

  .t-item:last-child .t-line { display: none; }

  .t-period {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 3px;
  }

  .t-item.t-now .t-period { color: var(--blue-dark); }

  .t-desc {
    font-size: 14.5px;
    color: var(--ink);
    line-height: 1.5;
  }

  .t-now-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: var(--white);
    background: var(--blue);
    padding: 2px 8px;
    border-radius: 100px;
    margin-left: 8px;
    vertical-align: middle;
  }

  .t-tentative-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-soft);
    background: transparent;
    border: 1px solid var(--line);
    padding: 1px 8px;
    border-radius: 100px;
    margin-left: 8px;
    vertical-align: middle;
  }

</style>
</head>

        { periodo: "2 octubre 2026", desc: "Reunión técnica final entre OGTIC y MITUR.", now: false, tentativo: true },

        { periodo: "6 octubre 2026", desc: "Lanzamiento del Portal Turístico de Pedernales.", now: false, tentativo: true }
      ]
    }
  ];

  const ACTIVE_STATES = ["Planificación", "Diseño", "Desarrollo", "Implementación"];
  const ALL_STATES = ["Planificación", "Diseño", "Desarrollo", "Implementación", "Operación", "Finalizado"];

  function statusClass(estado) {
    const map = {
      "Planificación": "st-Planificacion",
      "Diseño": "st-Diseno",
      "Desarrollo": "st-Desarrollo",
      "Implementación": "st-Implementacion",
      "Operación": "st-Operacion",
      "Finalizado": "st-Finalizado"
    };
    return map[estado] || "";
  }

  const ATTENTION_LEVELS = {
    curso: { label: "En curso", cls: "attn-curso" },
    atencion: { label: "Atención", cls: "attn-atencion" },
    critico: { label: "Crítico", cls: "attn-critico" }
  };

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------------------------------------------------------------
  // Indicadores — calculados a partir de PROJECTS
  // ---------------------------------------------------------------
  function renderStats() {
    const total = PROJECTS.length;
    const activos = PROJECTS.filter(p => ACTIVE_STATES.includes(p.estado)).length;
    const finalizados = PROJECTS.filter(p => p.estado === "Finalizado").length;

    document.getElementById('stats').innerHTML = `
      <div class="stat">
        <div class="num">${total}</div>
        <div class="label">Total de proyectos</div>
      </div>
      <div class="stat">
        <div class="num">${activos}</div>
        <div class="label">Proyectos activos</div>
      </div>
      <div class="stat">
        <div class="num">${finalizados}</div>
        <div class="label">Proyectos finalizados</div>
      </div>
    `;
  }

  // ---------------------------------------------------------------
  // Filtros
  // ---------------------------------------------------------------
  let currentFilter = "Todos";

  function renderFilters() {
    const options = ["Todos", ...ALL_STATES];
    const el = document.getElementById('filters');
    el.innerHTML = options.map(opt =>
      `<button class="filter-btn ${opt === currentFilter ? 'active' : ''}" data-filter="${escapeHtml(opt)}">${escapeHtml(opt)}</button>`
    ).join('');

    el.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentFilter = btn.getAttribute('data-filter');
        renderFilters();
        renderCards();
      });
    });
  }

  // ---------------------------------------------------------------
  // Tarjetas
  // ---------------------------------------------------------------
  function renderCards() {
    const filtered = currentFilter === "Todos"
      ? PROJECTS
      : PROJECTS.filter(p => p.estado === currentFilter);

    const grid = document.getElementById('cardGrid');

    if (filtered.length === 0) {
      grid.innerHTML = `<p style="color:var(--ink-soft); font-size:14.5px;">No hay proyectos en este estado.</p>`;
      return;
    }

    grid.innerHTML = filtered.map(p => `
      <div class="card" data-id="${p.id}">
        <div class="card-top">
          <h3 class="card-name">${escapeHtml(p.nombre)}</h3>
          <span class="status-pill ${statusClass(p.estado)}">${escapeHtml(p.estado)}</span>
        </div>
        <p class="card-desc">${escapeHtml(p.descripcion)}</p>
        <div class="tag-row">
          ${p.caracteristicas.map(c => `<span class="tag">${escapeHtml(c)}</span>`).join('')}
        </div>
        <div class="card-action">Ver proyecto →</div>
      </div>
    `).join('');

    grid.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => {
        openDetail(card.getAttribute('data-id'));
      });
    });
  }

  // ---------------------------------------------------------------
  // Ficha de proyecto
  // ---------------------------------------------------------------
  function openDetail(id) {
    const p = PROJECTS.find(pr => pr.id === id);
    if (!p) return;

    const contextBlock = p.contexto
      ? `<p class="detail-context">${escapeHtml(p.contexto)}</p>`
      : '';

    const attentionBlock = (p.atencion && p.atencion.length > 0) ? `
      <div class="section">
        <h3>Situación actual</h3>
        <div class="attention-list">
          ${p.atencion.map(a => {
            const lvl = ATTENTION_LEVELS[a.nivel];
            return `
              <div class="attention-item ${lvl.cls}">
                <div class="a-dot"></div>
                <div class="a-body">
                  <div class="a-level">${lvl.label}</div>
                  <div class="a-subject">${escapeHtml(a.asunto)}</div>
                  <div class="a-desc">${escapeHtml(a.descripcion)}</div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    ` : '';

    const milestonesHtml = p.hitos.map(h => `
      <div class="milestone m-${h.estado}">
        <div class="m-marker">${h.estado === 'done' ? '✓' : ''}</div>
        <div class="m-label">${escapeHtml(h.texto)}</div>
      </div>
    `).join('');

    const timelineHtml = p.cronograma.map(t => `
      <div class="t-item ${t.now ? 't-now' : ''}">
        <div class="t-rail">
          <div class="t-line"></div>
          <div class="t-dot"></div>
        </div>
        <div>
          <div class="t-period">${escapeHtml(t.periodo)}${t.now ? '<span class="t-now-badge">Estamos aquí</span>' : ''}${t.tentativo ? '<span class="t-tentative-badge">Tentativo</span>' : ''}</div>
          <div class="t-desc">${escapeHtml(t.desc)}</div>
        </div>
      </div>
    `).join('');

    const avanceHtml = Array.isArray(p.avance)
      ? `<div class="avance-groups">${p.avance.map(g => `
          <div class="avance-group">
            <h4>${escapeHtml(g.titulo)}</h4>
            <p>${escapeHtml(g.texto)}</p>
          </div>
        `).join('')}</div>`
      : `<p>${escapeHtml(p.avance)}</p>`;

    document.getElementById('detailView').innerHTML = `
      <button class="back-link" id="backBtn">← Volver a proyectos</button>

      <div class="detail-header">
        <span class="status-pill ${statusClass(p.estado)}">${escapeHtml(p.estado)}</span>
        <h2>${escapeHtml(p.nombre)}</h2>
        <p class="detail-desc">${escapeHtml(p.descripcion)}</p>
        ${contextBlock}
        <div class="tag-row">
          ${p.caracteristicas.map(c => `<span class="tag">${escapeHtml(c)}</span>`).join('')}
        </div>
      </div>

      <div class="section">
        <h3>Avance actual</h3>
        ${avanceHtml}
      </div>

      <div class="section">
        <h3>Próximo paso</h3>
        <div class="next-step-box">
          <p>${escapeHtml(p.proximoPaso)}</p>
        </div>
      </div>

      ${attentionBlock}

      <div class="section">
        <h3>Hitos</h3>
        <div class="milestones">${milestonesHtml}</div>
      </div>

      <div class="section">
        <h3>Cronograma</h3>
        <div class="timeline"><div class="timeline-track">${timelineHtml}</div></div>
      </div>
    `;

    document.getElementById('backBtn').addEventListener('click', closeDetail);

    document.getElementById('mainView').classList.add('hidden');
    document.getElementById('detailView').classList.add('visible');
    window.scrollTo(0, 0);
  }

  function closeDetail() {
    document.getElementById('detailView').classList.remove('visible');
    document.getElementById('mainView').classList.remove('hidden');
    window.scrollTo(0, 0);
  }

  // ---------------------------------------------------------------
  // Init
  // ---------------------------------------------------------------
  renderStats();
  renderFilters();
  renderCards();
</script>
